name: Mirror jdtls milestones

on:
  schedule:
    # Daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      keep_last:
        description: "How many newest milestone versions to consider"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror milestones into Releases
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_LAST: ${{ github.event.inputs.keep_last || '10' }}
        run: bash scripts/mirror.sh
